[project]
name = "inhouse"
version = "0.1.0"
description = "Self-hosted batch document extraction"
requires-python = ">=3.10"
dependencies = [
    "requests>=2.31",
    "boto3>=1.34",
    "lxml>=5.0",
    "httpx>=0.27",
    "psycopg[binary]>=3.1",
    "fastapi>=0.110",
    "uvicorn>=0.27",
]

[project.optional-dependencies]
dev = ["pytest>=7.4"]

[project.scripts]
inhouse = "inhouse.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["inhouse"]

[tool.pytest.ini_options]
testpaths = ["tests"]
