name: nightly

# The pipeline, once a night.
#
# The ordering is the cost argument. A g4dn.xlarge is $0.53/hour and the model
# is needed for roughly twenty minutes of a ninety-minute run, so the GPU is
# started as late as possible:
#
#   ingest   ~60 min   GPU stopped   (rate-limited at 8 req/s by the SEC)
#   extract  ~22 min   GPU RUNNING   (the instance runs this on itself)
#   load      ~2 min   GPU stopped
#
# Extraction runs ON the instance rather than being driven over SSH from here.
# A runner has no stable address -- GitHub's ranges are thousands of rotating
# IPs -- so a security group cannot admit it without effectively opening port
# 22 to everyone, and SGLang has no authentication. The instance boots, runs
# the job, uploads its log, and powers itself off. That also means a failure in
# this workflow cannot leave the meter running.
#
# Credentials are OIDC: GitHub mints a token per run proving which repository
# is executing, AWS exchanges it for temporary credentials. Nothing long-lived
# is stored.

on:
  schedule:
    # 09:00 UTC = 2am Pacific, 5am Eastern. Overnight, so the dashboard is fresh
    # when someone opens it in the morning.
    #
    # The date resolves to "yesterday in UTC", which at 2am PT is the previous
    # trading day -- the one whose index EDGAR published that evening. Running
    # in the afternoon instead would target the day before last, because the UTC
    # date has already rolled over by then.
    #
    # Tue-Sat UTC covers Mon-Fri filing days. GitHub's scheduler is best-effort
    # and can start 10-30 minutes late, which a batch job that finishes hours
    # before anyone looks at it tolerates easily.
    - cron: "0 9 * * 2-6"
  workflow_dispatch:
    inputs:
      date:
        description: "Filing date (YYYY-MM-DD), blank for yesterday"
        required: false
        default: ""
      skip_extract:
        description: "Ingest and load only — never starts the GPU"
        type: boolean
        default: false

concurrency:
  # Never two nights at once: they would contend for one instance and the same
  # S3 keys. Queue rather than cancel, so a running job reaches its end.
  group: nightly
  cancel-in-progress: false

permissions:
  id-token: write      # to mint the OIDC token
  contents: read

env:
  AWS_REGION: us-east-2
  INSTANCE_ID: ${{ vars.GPU_INSTANCE_ID }}
  STORAGE_URI: ${{ vars.STORAGE_URI }}

jobs:
  ingest:
    name: Fetch filings to S3
    runs-on: ubuntu-latest
    timeout-minutes: 120
    outputs:
      date: ${{ steps.day.outputs.date }}

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - run: pip install -e .

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - id: day
        run: |
          DATE="${{ inputs.date }}"
          [ -n "$DATE" ] || DATE=$(date -u -d 'yesterday' +%F)
          echo "date=$DATE" >> "$GITHUB_OUTPUT"
          echo "## Filing date \`$DATE\`" >> "$GITHUB_STEP_SUMMARY"

      - name: Ingest
        env:
          # The SEC blocks requests without real contact details and rate-limits
          # at 10 req/s; the client paces at 8.
          SEC_USER_AGENT: ${{ secrets.SEC_USER_AGENT }}
        run: |
          set -o pipefail
          python -m inhouse ingest --date "${{ steps.day.outputs.date }}" | tee out.txt
          { echo '### Ingest'; echo '```'; cat out.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"

  extract:
    name: Extract on the GPU
    needs: ingest
    if: ${{ !inputs.skip_extract }}
    runs-on: ubuntu-latest
    timeout-minutes: 75

    steps:
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Clear any previous completion marker
        # The poll below waits for this key to appear. A stale one from last
        # night would make the job return instantly with yesterday's status.
        run: |
          aws s3 rm "$STORAGE_URI/logs/extract-${{ needs.ingest.outputs.date }}.done" \
            --only-show-errors || true

      - name: Start the instance
        # The date is passed through instance tags rather than SSH, since there
        # is no shell to pass an argument to. The unit on the box reads it back
        # from its own metadata.
        run: |
          aws ec2 create-tags --resources "$INSTANCE_ID" \
            --tags "Key=ExtractDate,Value=${{ needs.ingest.outputs.date }}"
          aws ec2 start-instances --instance-ids "$INSTANCE_ID"
          aws ec2 wait instance-running --instance-ids "$INSTANCE_ID"
          echo "Instance running. Extraction runs on the box; polling S3 for the result."

      - name: Wait for extraction to finish
        # Polls for the marker the instance writes on its way out. Boot, model
        # load and 181 filings take roughly 25 minutes.
        #
        # Fifty minutes. Extraction is ~22 for a normal day plus ~4 for boot
        # and model load, so this is roughly double the expected time -- enough
        # for a heavy filing day without waiting all night on a machine that is
        # never going to answer.
        #
        # The cap used to be constrained by OIDC credentials expiring after an
        # hour: a poll that ran the clock out left the stop step unable to stop
        # anything. The re-mint step below removes that, so the limit is now
        # about not burning GPU time on a hung run rather than about tokens.
        #
        # Whatever happens here, the instance stops itself when its own script
        # finishes -- this timeout only decides how long the workflow waits to
        # hear about it.
        run: |
          KEY="$STORAGE_URI/logs/extract-${{ needs.ingest.outputs.date }}.done"
          for i in $(seq 1 100); do
            if aws s3 cp "$KEY" done.json --only-show-errors 2>/dev/null; then
              echo "Marker found after $((i / 2)) minutes"
              cat done.json
              STATUS=$(python3 -c "import json;print(json.load(open('done.json'))['status'])")
              aws s3 cp "$STORAGE_URI/logs/extract-${{ needs.ingest.outputs.date }}.log" \
                extract.log --only-show-errors || true
              { echo '### Extract'; echo '```'; tail -40 extract.log; echo '```'; } \
                >> "$GITHUB_STEP_SUMMARY"
              exit "$STATUS"
            fi
            sleep 30
          done
          echo "::error::extraction did not report completion within 50 minutes"
          exit 1

      # Credentials from the first assume-role are close to expiry by now, and
      # an expired credential means the stop below silently fails. Minting fresh
      # ones costs a second and is the difference between a stopped instance and
      # a running one nobody notices until the bill.
      - uses: aws-actions/configure-aws-credentials@v4
        if: always()
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Ensure the instance is stopped
        # The box powers itself off, so this is normally a no-op. It exists for
        # the case where it did not get that far -- a kernel panic, a failure
        # before the script's shutdown line, or the unit never having been
        # installed. An instance left running is $380 a month.
        if: always()
        run: |
          STATE=$(aws ec2 describe-instances --instance-ids "$INSTANCE_ID" \
                    --query 'Reservations[0].Instances[0].State.Name' --output text)
          echo "instance state: $STATE"
          if [ "$STATE" != "stopped" ] && [ "$STATE" != "stopping" ]; then
            echo "::warning::instance did not stop itself — stopping it"
            aws ec2 stop-instances --instance-ids "$INSTANCE_ID"
            # Confirm rather than assume: a failed stop that goes unreported is
            # the expensive case.
            aws ec2 wait instance-stopping --instance-ids "$INSTANCE_ID" 2>/dev/null \
              || aws ec2 wait instance-stopped --instance-ids "$INSTANCE_ID"
            echo "confirmed stopping"
          fi

  load:
    name: Load to Postgres
    needs: [ingest, extract]
    # Runs even when extraction failed or was skipped: filings and insider
    # transactions are useful without the summaries, and a partial night beats
    # none. Form 4 parsing needs no GPU at all.
    if: ${{ always() && needs.ingest.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - run: pip install -e .

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Load
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          # The load path never calls EDGAR, but Config validates every field on
          # construction -- including the User-Agent the SEC requires. Cheaper to
          # pass it than to make the config lazy.
          SEC_USER_AGENT: ${{ secrets.SEC_USER_AGENT }}
        run: |
          set -o pipefail
          # Idempotent: filings and extractions upsert on their keys, insider
          # transactions on (accession, txn_index). Re-running a night corrects
          # it rather than duplicating it.
          python -m inhouse load --date "${{ needs.ingest.outputs.date }}" --show 10 | tee out.txt
          { echo '### Loaded'; echo '```'; cat out.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
